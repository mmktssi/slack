<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会計事業部 - Slack研修</title>
<meta name="theme-color" content="#3f0e40">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ===== トップバー ===== -->
  <header id="topbar">
    <div class="tb-left">
      <button class="tb-btn" id="menuBtn" title="メニュー"><i data-ic="menu"></i></button>
      <span class="grow"></span>
      <button class="tb-btn" id="backBtn" title="戻る"><i data-ic="left"></i></button>
      <button class="tb-btn" id="fwdBtn" title="進む"><i data-ic="right"></i></button>
      <button class="tb-btn" id="historyBtn" title="履歴"><i data-ic="clock"></i></button>
    </div>
    <div class="tb-search">
      <i data-ic="search"></i>
      <input id="globalSearch" type="search" placeholder="会計事業部 内を検索する" autocomplete="off">
    </div>
    <button class="tb-ai" id="aiBtn" title="AI アシスタント"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h6v6H5z" fill="#36C5F0"/><path d="M13 5h6v6h-6z" fill="#2EB67D"/><path d="M5 13h6v6H5z" fill="#E01E5A"/><path d="M13 13h6v6h-6z" fill="#ECB22E"/><circle cx="9.5" cy="11" r="1.1" fill="#fff"/><circle cx="14.5" cy="11" r="1.1" fill="#fff"/><path d="M9.5 14.2c1.4 1.3 3.6 1.3 5 0" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></button>
    <div class="tb-right">
      <button class="tb-btn" id="helpBtn" title="ヘルプ"><i data-ic="help"></i></button>
      <div class="win-ctrls" id="winCtrls">
        <button class="win-btn" id="winMin" title="最小化"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
        <button class="win-btn" id="winMax" title="最大化"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
        <button class="win-btn win-close" id="winClose" title="閉じる"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10"/></svg></button>
      </div>
    </div>
  </header>

  <div id="body">
    <!-- ===== 左端レール ===== -->
    <nav id="rail">
      <button class="ws-icon" id="wsIcon" title="会計事業部">会計</button>
      <button class="rail-item" data-rail="bot"><span class="rail-ic"><i data-ic="bot"></i></span><span>Slackbot</span></button>
      <button class="rail-item active" data-rail="home"><span class="rail-ic"><i data-ic="home"></i></span><span>ホーム</span></button>
      <button class="rail-item" data-rail="dms"><span class="rail-ic"><i data-ic="chat"></i><b class="badge" id="dmBadge" hidden></b></span><span>DM</span></button>
      <button class="rail-item" data-rail="activity"><span class="rail-ic"><i data-ic="bell"></i><b class="badge" id="actBadge" hidden></b></span><span>アクティビティ</span></button>
      <button class="rail-item" data-rail="files"><span class="rail-ic"><i data-ic="files"></i></span><span>ファイル</span></button>
      <button class="rail-item" data-rail="todo"><span class="rail-ic"><i data-ic="check"></i></span><span>To-Do</span></button>
      <button class="rail-item" data-rail="apps"><span class="rail-ic"><i data-ic="apps"></i></span><span>エージェントとツール</span></button>
      <span class="grow"></span>
      <button class="rail-round" id="railAdd" title="新規作成"><i data-ic="plus"></i></button>
      <button class="rail-round" id="themeBtn" title="ダークモード切替"><i data-ic="moon"></i></button>
      <button class="rail-me" id="meBtn" title="プロフィール"><span class="avatar" id="meAvatar"></span><span class="presence" id="mePresence"></span></button>
    </nav>

    <!-- ===== サイドバー ===== -->
    <aside id="sidebar">
      <!-- ファイル画面用サイドバー -->
      <div id="sbFiles" hidden>
        <div class="sb-head">
          <span class="sb-title">ファイル</span>
          <span class="grow"></span>
          <button class="sb-icon" id="sbFilesAdd" title="新規作成"><i data-ic="plus"></i></button>
        </div>
        <div class="sb-scroll">
          <div class="sb-nav">
            <button class="sb-row" data-fsub="all"><i data-ic="copy"></i><span>全ファイル</span></button>
            <button class="sb-row" data-fsub="canvas"><i data-ic="canvasnote"></i><span>canvas</span></button>
          </div>
          <hr>
          <div class="sb-nav">
            <button class="sb-row" data-fsub="deleted"><i data-ic="trash"></i><span>削除済み</span></button>
          </div>
          <hr>
          <div class="sb-section" data-sec="fstarred">
            <button class="sb-sec-head"><i data-ic="star"></i><span>Starred</span></button>
            <div class="sb-sec-body" id="starredFiles"></div>
          </div>
        </div>
      </div>
      <div id="sbHome">
      <div class="sb-head">
        <button class="ws-name" id="wsName"><span id="wsNameText">会計事業部</span><i data-ic="down"></i></button>
        <span class="grow"></span>
        <button class="sb-icon" id="sbSettings" title="設定"><i data-ic="gear"></i></button>
        <button class="sb-icon" id="sbCompose" title="新規メッセージ"><i data-ic="edit"></i></button>
      </div>
      <div class="sb-scroll">
        <button class="upgrade-btn" id="upgradeBtn"><i data-ic="rocket"></i>プランをアップグレード</button>
        <label class="sb-find"><i data-ic="search"></i><input id="sbFilter" placeholder="会話を見つける..." autocomplete="off"></label>

        <div class="sb-nav">
          <button class="sb-row" data-view="threads"><i data-ic="thread"></i><span>スレッド</span></button>
          <button class="sb-row" data-view="huddles"><i data-ic="headphones"></i><span>ハドルミーティング</span></button>
          <button class="sb-row" data-view="drafts"><i data-ic="send"></i><span>下書き＆送信済み</span></button>
          <button class="sb-row" data-view="bookmarks"><i data-ic="bookmark"></i><span>ブックマークに登録済み</span></button>
          <button class="sb-row" data-view="directory"><i data-ic="users"></i><span>ディレクトリ</span></button>
        </div>
        <hr>
        <div class="sb-section" data-sec="starred">
          <button class="sb-sec-head"><i data-ic="star"></i><span>スター付き</span></button>
          <div class="sb-sec-body" id="starredList"></div>
        </div>
        <div class="sb-section" data-sec="channels">
          <button class="sb-sec-head"><i data-ic="hashbox"></i><span>チャンネル</span></button>
          <div class="sb-sec-body" id="channelList"></div>
        </div>
        <div class="sb-section" data-sec="dms">
          <button class="sb-sec-head"><i data-ic="chat"></i><span>ダイレクトメッセージ</span></button>
          <div class="sb-sec-body" id="dmList"></div>
        </div>
        <div class="sb-section" data-sec="apps">
          <button class="sb-sec-head"><i data-ic="apps"></i><span>App</span></button>
          <div class="sb-sec-body" id="appList"></div>
        </div>
      </div>
      </div>
      <div id="huddleBar" hidden></div>
    </aside>

    <!-- ===== メイン ===== -->
    <main id="main"></main>

    <!-- ===== スレッドパネル ===== -->
    <section id="threadPanel" hidden></section>
    <section id="profilePanel" hidden></section>
  </div>
</div>

<div id="popLayer"></div>
<div id="modalLayer"></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
